# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: "Tests"

on:
  pull_request: null
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  android:
    name: Android Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: yes | sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Assemble Android and Wear OS debug APKs
        run: ./gradlew :app:assembleDebug :wearApp:assembleDebug :wearApp:testDebugUnitTest --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", MODE="0666", GROUP="kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
