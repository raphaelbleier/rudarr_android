# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: "Tests"

on:
  pull_request: null
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:

  android:
    name: Android Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: yes | sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon

  xcode:
    name: Xcode Tests (${{ matrix.name }})
    runs-on: macos-26
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            platform: "iOS Simulator,name=iPhone 17 Pro"
            action: test
          - name: macOS
            platform: "macOS"
            action: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select latest Xcode
        run: |
          LATEST_VERSION=$(ls -d /Applications/Xcode_*.app | sed 's|.*Xcode_||;s|\.app||' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          sudo xcode-select -s "/Applications/Xcode_${LATEST_VERSION}.app"
          xcodebuild -version

      - name: Build and run tests
        run: |
          xcodebuild ${{ matrix.action }} \
            -scheme Ruddarr \
            -skipPackagePluginValidation \
            -destination 'platform=${{ matrix.platform }}' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
