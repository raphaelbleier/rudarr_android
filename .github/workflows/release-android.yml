# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Android Release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: "android-release-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: yes | sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ruddarr-release.keystore"

      - name: Build signed Android and Wear OS APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ruddarr-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :wearApp:assembleRelease --no-daemon

      - name: Verify APK signatures and stage artifacts
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose wearApp/build/outputs/apk/release/wearApp-release.apk
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/Ruddarr-${RELEASE_TAG}-android.apk"
          cp wearApp/build/outputs/apk/release/wearApp-release.apk "release-artifacts/Ruddarr-${RELEASE_TAG}-wear-os.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ruddarr-${{ env.RELEASE_TAG }}
          path: release-artifacts/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ANDROID_APK="release-artifacts/Ruddarr-${RELEASE_TAG}-android.apk"
          WEAR_APK="release-artifacts/Ruddarr-${RELEASE_TAG}-wear-os.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ANDROID_APK" "$WEAR_APK" --clobber
          else
            gh release create "$RELEASE_TAG" "$ANDROID_APK" "$WEAR_APK" --title "Ruddarr ${RELEASE_TAG}" --generate-notes
          fi
